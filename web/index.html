<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20x%3D%273.5%27%20y%3D%273.5%27%20width%3D%2725%27%20height%3D%2725%27%20rx%3D%277%27%20fill%3D%27none%27%20stroke%3D%27%231f2328%27%20stroke-width%3D%273%27%2F%3E%3Crect%20x%3D%2712%27%20y%3D%2712%27%20width%3D%278%27%20height%3D%278%27%20rx%3D%272%27%20fill%3D%27%231f2328%27%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="hdr">
  <div class="brand"><span class="mark"><span></span></span><span>Nexus</span></div>
</header>
<nav class="subnav" id="subnav">
  <button type="button" class="on" data-route="skills" aria-current="page">Skills</button>
  <button type="button" data-route="global">Global Instructions</button>
</nav>
<main class="page">
  <div id="banners" class="banners"></div>

  <section class="sec" id="skills">
    <div class="sec-hd">
      <h2>Skills</h2>
      <div class="sec-tools" id="skills-tools">
        <select class="input" id="skills-kind" aria-label="Filter by kind">
          <option value="all">All kinds</option>
          <option value="installed">Installed</option>
          <option value="custom">Custom</option>
          <option value="control">Control</option>
        </select>
        <input class="input" id="skills-filter" type="search" placeholder="Filter by name" autocomplete="off" spellcheck="false">
        <span class="hint" id="skills-count"></span>
      </div>
    </div>
    <div id="skills-body" class="card empty">Loading skills.</div>
  </section>

  <section class="sec" id="global">
    <div class="sec-hd">
      <h2>Global Instructions</h2>
      <div class="sec-tools" id="global-tools"></div>
    </div>
    <div id="global-body" class="card empty">No global instructions loaded yet.</div>
  </section>

  <section class="sec" id="last-command">
    <div class="sec-hd"><h2>Last command</h2></div>
    <div id="last-command-body" class="card empty">No command has run yet.</div>
  </section>

</main>
<div id="toasts" class="toasts"></div>
<script src="vendor/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
