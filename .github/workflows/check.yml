# The whole suite, run by a machine on every change.
#
# Nexus is being ported from Bash to TypeScript on Node 24 (#72), and the two
# CLIs grow side by side until the port ends. `Tests` runs the Bash suite,
# `bash tests/run.sh`, on Linux alone: it needs bash, git, python3, jq and
# coreutils, all of which ubuntu-latest already carries. The Node suite runs
# `npm run check` (the types, then `node --test`) on Linux and on Windows.
# There is no build step, because Node 24 runs the TypeScript directly.
#
# Every test gets its own home under a temporary root and refuses to run
# outside it, so nothing here reaches the runner's own files.
#
# Each job name is a required check in the repository ruleset: a rename must
# update the ruleset in the same change.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - run: bash tests/run.sh

  node:
    name: Types and tests on ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            os: ubuntu-latest
          - system: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check
