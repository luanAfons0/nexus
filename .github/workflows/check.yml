# The whole suite, run by a machine on every change.
#
# The repository has no build step: Node runs the TypeScript directly, and
# only a Plugin Release is built (ADR 0011). `npm run check` checks the types,
# then runs every test with `node --test`, on Linux and on Windows, because a
# Managed Link is a symlink on one and a junction or a Managed Copy on the
# other (ADR 0010).
#
# Every test gets its own home under a temporary root and refuses to run
# outside it, so nothing here reaches the runner's own files.
#
# Each job name is a required check in the repository ruleset: a rename must
# update the ruleset in the same change.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Types and tests on ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            os: ubuntu-latest
          - system: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check
